name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MAWI_LLM_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Compile application packages
        run: python -m compileall agents api approval context data demo evaluation memory orchestrator tools workflows

      - name: Run complete test suite
        run: python -m pytest

      - name: Run deterministic demo smoke test
        run: python -m pytest tests/scenarios/test_canonical_demo_scenarios.py::test_stalled_deal_waits_for_approval_then_resumes_and_persists
